apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Deep Insights
    categories: AI/Machine Learning
    containerImage: ghcr.io/palenaai/litellm-operator:v0.7.0
    description: Kubernetes operator for deploying and managing production-ready LiteLLM
      AI Gateway instances.
    repository: https://github.com/PalenaAI/litellm-operator
    support: bitkaio LLC
  name: litellm-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: LiteLLMOrganization is the Schema for the litellmorganizations
        API.
      displayName: LiteLLM Organization
      kind: LiteLLMOrganization
      name: litellmorganizations.litellm.palena.ai
      version: v1alpha1
    - description: LiteLLMCredential is the Schema for the litellmcredentials API
        — reusable provider credentials rendered into the proxy config.
      displayName: LiteLLM Credential
      kind: LiteLLMCredential
      name: litellmcredentials.litellm.palena.ai
      version: v1alpha1
    - description: LiteLLMGuardrail is the Schema for the litellmguardrails API —
        content moderation and safety integrations rendered into the proxy config.
      displayName: LiteLLM Guardrail
      kind: LiteLLMGuardrail
      name: litellmguardrails.litellm.palena.ai
      version: v1alpha1
    - description: |-
        LiteLLMCustomer is the Schema for the litellmcustomers API.
        A Customer represents an external end-user of the AI gateway with its own
        spending, rate, and access policies.
      displayName: LiteLLM Customer
      kind: LiteLLMCustomer
      name: litellmcustomers.litellm.palena.ai
      version: v1alpha1
    - description: LiteLLMInstance is the Schema for the litellminstances API.
      displayName: LiteLLM Instance
      kind: LiteLLMInstance
      name: litellminstances.litellm.palena.ai
      version: v1alpha1
      statusDescriptors:
      - description: Whether the instance is fully ready.
        displayName: Ready
        path: ready
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Internal cluster endpoint URL.
        displayName: Endpoint
        path: endpoint
        x-descriptors:
        - urn:alm:descriptor:org.w3:link
      - description: Current LiteLLM version running.
        displayName: LiteLLM Version
        path: version
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Total replicas running for this instance.
        displayName: Replicas
        path: replicas
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:podCount
      - description: Ready replicas serving traffic.
        displayName: Ready Replicas
        path: readyReplicas
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:podCount
      - description: Whether the backing database is reachable.
        displayName: Database Connected
        path: database.connected
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Whether Redis is reachable (if configured).
        displayName: Redis Connected
        path: redis.connected
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Whether a LiteLLM Enterprise license is active.
        displayName: License Active
        path: license.active
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Last successful deployment revision (used for auto-rollback).
        displayName: Last Successful Revision
        path: lastSuccessfulRevision
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Current health and readiness conditions.
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
    - description: LiteLLMModel is the Schema for the litellmmodels API.
      displayName: LiteLLM Model
      kind: LiteLLMModel
      name: litellmmodels.litellm.palena.ai
      version: v1alpha1
      statusDescriptors:
      - description: Whether the model is synced to the LiteLLM proxy.
        displayName: Synced
        path: synced
        x-descriptors:
        - urn:alm:descriptor:text
      - description: LiteLLM-assigned model ID.
        displayName: LiteLLM Model ID
        path: litellmModelId
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Model health as reported by the LiteLLM /health endpoint.
        displayName: Health
        path: health
        x-descriptors:
        - urn:alm:descriptor:text
      - description: P50 latency in milliseconds observed from LiteLLM metrics.
        displayName: P50 Latency (ms)
        path: latencyP50Ms
        x-descriptors:
        - urn:alm:descriptor:text
      - description: P95 latency in milliseconds observed from LiteLLM metrics.
        displayName: P95 Latency (ms)
        path: latencyP95Ms
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Total requests served by this model in the last 24 hours.
        displayName: Requests (24h)
        path: requestsLast24h
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Last successful sync time with the LiteLLM proxy.
        displayName: Last Sync Time
        path: lastSyncTime
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Standard Kubernetes conditions.
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
    - description: LiteLLMTeam is the Schema for the litellmteams API.
      displayName: LiteLLM Team
      kind: LiteLLMTeam
      name: litellmteams.litellm.palena.ai
      version: v1alpha1
    - description: LiteLLMUser is the Schema for the litellmusers API.
      displayName: LiteLLM User
      kind: LiteLLMUser
      name: litellmusers.litellm.palena.ai
      version: v1alpha1
    - description: LiteLLMVirtualKey is the Schema for the litellmvirtualkeys API.
      displayName: LiteLLM Virtual Key
      kind: LiteLLMVirtualKey
      name: litellmvirtualkeys.litellm.palena.ai
      version: v1alpha1
  description: |
    The LiteLLM Operator is a Kubernetes operator for deploying and managing
    production-ready [LiteLLM](https://www.litellm.ai/) AI Gateway instances.

    Built with [Operator SDK](https://sdk.operatorframework.io/) for OLM integration,
    OperatorHub distribution, and first-class OpenShift support.

    ## Features

    - **Declarative LiteLLM deployment** — manage proxy instances, organizations, models, teams, users, customers, credentials, guardrails, and virtual keys as Kubernetes custom resources
    - **Bidirectional config sync** — reconciles CRD state with the LiteLLM REST API on every sync interval
    - **Team member management** — three modes: CRD authoritative, SSO authoritative, and mixed
    - **VirtualKey secret management** — generated API keys stored in Kubernetes Secrets with owner references
    - **Reusable credentials** — `LiteLLMCredential` CRs produce a shared `credential_list` referenced by any model, with API keys injected from Secrets as env vars
    - **Content moderation** — `LiteLLMGuardrail` CRs configure Aporia, Lakera, Bedrock, Presidio, and other guardrail providers with per-key and per-team opt-in
    - **Customer / end-user billing** — `LiteLLMCustomer` CRs manage external end-user budgets, rate limits, and model access for multi-tenant applications
    - **Organization hierarchy** — `LiteLLMOrganization` groups teams under a shared budget and rate limit envelope
    - **SSO/SCIM support** — configure Azure Entra ID, Okta, Google, or generic OIDC providers declaratively
    - **Production-ready** — HPA, PDB, NetworkPolicy, health checks, resource limits, security contexts, ServiceMonitor, PrometheusRule, Grafana dashboard

    ## Prerequisites

    - Kubernetes v1.28+
    - A PostgreSQL database for LiteLLM state storage (connection string provided via a Secret)
    - (Optional) Redis for caching and rate limiting
    - (Optional) An OIDC provider for SSO (Azure Entra ID, Okta, Google, or generic OIDC)
  displayName: LiteLLM Operator
  icon:
  - base64data: ""
    mediatype: image/svg+xml
  install:
    spec:
      deployments: []
    strategy: deployment
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: true
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - litellm
  - ai
  - llm
  - gateway
  - proxy
  - kubernetes
  - operator
  links:
  - name: Documentation
    url: https://litellm-operator.palena.ai/
  - name: API Reference
    url: https://litellm-operator.palena.ai/reference/crds
  - name: LiteLLM
    url: https://www.litellm.ai/
  maintainers:
  - email: team@bitkaio.com
    name: bitkaio LLC
  maturity: alpha
  minKubeVersion: 1.28.0
  provider:
    name: bitkaio LLC
    url: https://palena.ai
  version: 0.0.0
