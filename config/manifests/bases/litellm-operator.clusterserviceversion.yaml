  - name: API Reference
    url: https://litellm-operator.palena.ai/reference/crds
  - name: LiteLLM
    url: https://www.litellm.ai/
  maintainers:
  - email: team@bitkaio.com
    name: bitkaio LLC
  maturity: alpha
  minKubeVersion: 1.28.0
  provider:
    name: bitkaio LLC
    url: https://palena.ai
  version: 0.0.0
