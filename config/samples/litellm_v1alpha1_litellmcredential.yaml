apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMCredential
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: openai-prod
spec:
  instanceRef:
    name: litellminstance-sample
  # Name used as the `credential_list` entry key in the generated
  # proxy_server_config.yaml. Models reference this via
  # litellmParams.credentialRef.
  credentialName: openai-prod
  apiKeySecretRef:
    name: openai-credentials
    key: OPENAI_API_KEY
  apiBase: https://api.openai.com/v1
---
apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMCredential
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: azure-east
spec:
  instanceRef:
    name: litellminstance-sample
  credentialName: azure-east
  apiKeySecretRef:
    name: azure-credentials
    key: AZURE_API_KEY
  apiBase: https://azure-east.openai.azure.com
  apiVersion: "2024-02-01"
