apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMGuardrail
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: pii-detector
spec:
  instanceRef:
    name: litellminstance-sample
  # Name referenced from LiteLLMVirtualKey.spec.guardrails and
  # LiteLLMTeam.spec.guardrails.
  guardrailName: pii-detector
  provider: aporia
  mode: pre_call
  apiKeySecretRef:
    name: aporia-credentials
    key: APORIA_API_KEY
  apiBase: https://gr-prd-dc.aporia.com
  defaultOn: false
---
apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMGuardrail
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: presidio-redact
spec:
  instanceRef:
    name: litellminstance-sample
  guardrailName: presidio-redact
  provider: presidio
  mode: pre_call
  # Local presidio does not need an API key; point it at an internal service.
  params:
    presidio_analyzer_api_base: http://presidio-analyzer.guardrails.svc.cluster.local:3000
    presidio_anonymizer_api_base: http://presidio-anonymizer.guardrails.svc.cluster.local:3000
---
apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMGuardrail
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: bedrock-pii
spec:
  instanceRef:
    name: litellminstance-sample
  guardrailName: bedrock-pii
  provider: bedrock
  mode: post_call
  apiKeySecretRef:
    name: aws-credentials
    key: AWS_SECRET_ACCESS_KEY
  params:
    guardrailIdentifier: abc123
    guardrailVersion: DRAFT
    aws_region_name: us-east-1
---
apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMGuardrail
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: my-http-guardrail
spec:
  instanceRef:
    name: litellminstance-sample
  guardrailName: my-http-guardrail
  # Point the proxy at any HTTP service you host in-cluster — no Python
  # required. LiteLLM POSTs to {apiBase}/beta/litellm_basic_guardrail_api.
  provider: generic_guardrail_api
  mode: pre_call
  apiBase: http://my-guardrail.guardrails.svc.cluster.local:8080
  # Optional: sent to your endpoint as a Bearer token.
  apiKeySecretRef:
    name: my-guardrail-credentials
    key: API_KEY
  # What to do if your endpoint is unreachable: fail_closed (reject) or fail_open (allow).
  unreachableFallback: fail_closed
  # Forwarded to your endpoint under additional_provider_specific_params.
  params:
    threshold: "0.8"
---
apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMGuardrail
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: my-custom-guardrail
spec:
  instanceRef:
    name: litellminstance-sample
  guardrailName: my-custom-guardrail
  # Run your own CustomGuardrail subclass baked into the proxy image
  # (set LiteLLMInstance.spec.image to a custom build containing the class).
  provider: custom_guardrail
  mode: pre_call
  guardrailClass: my_pkg.adapters.MyGuardrail
  params:
    threshold: "0.8"
