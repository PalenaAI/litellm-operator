apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: engineering-ci-key
spec:
  instanceRef:
    name: litellminstance-sample
  keyAlias: engineering-ci-key
  teamRef:
    name: engineering
  models:
    - gpt-4o
  maxBudget: "100"
  budgetDuration: "30d"
  rpmLimit: 60
  keySecretName: engineering-ci-api-key
  # Annotate the generated Secret so kubernetes-reflector mirrors it into the
  # namespace where the consuming application runs.
  keySecretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "apps"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "apps"
    labels:
      app.kubernetes.io/part-of: engineering-ci
