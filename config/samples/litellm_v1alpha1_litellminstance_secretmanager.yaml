apiVersion: litellm.palena.ai/v1alpha1
kind: LiteLLMInstance
metadata:
  labels:
    app.kubernetes.io/name: litellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: litellminstance-with-secret-manager
spec:
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-v1.60.0

  replicas: 1

  masterKey:
    autoGenerate: true

  database:
    external:
      connectionSecretRef:
        name: litellm-db-credentials
        key: DATABASE_URL

  service:
    type: ClusterIP
    port: 4000

  # External secret manager integration.
  # LiteLLM fetches API keys from the provider at runtime instead of
  # requiring them in Kubernetes Secrets.
  #
  # This example uses AWS Secret Manager. See commented examples below
  # for Azure Key Vault and HashiCorp Vault.
  secretManager:
    provider: aws_secret_manager
    credentialsSecretRef:
      name: litellm-aws-credentials
    hostedKeys:
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
    storeVirtualKeys: true
    prefixForStoredVirtualKeys: "litellm/"
    accessMode: read_and_write
    aws:
      region: us-east-1

  # --- AWS with IRSA (no static credentials needed) ---
  # secretManager:
  #   provider: aws_secret_manager
  #   hostedKeys:
  #     - OPENAI_API_KEY
  #   accessMode: read_only
  #   aws:
  #     region: us-east-1
  #     roleARN: arn:aws:iam::123456789012:role/litellm-secrets
  #     sessionName: litellm
  #     webIdentityTokenPath: /var/run/secrets/eks.amazonaws.com/serviceaccount/token

  # --- Azure Key Vault (enterprise) ---
  # secretManager:
  #   provider: azure_key_vault
  #   credentialsSecretRef:
  #     name: litellm-azure-credentials
  #   hostedKeys:
  #     - OPENAI_API_KEY
  #   accessMode: read_only
  #   azure:
  #     vaultURI: https://my-vault.vault.azure.net
  #     tenantID: 00000000-0000-0000-0000-000000000000

  # --- HashiCorp Vault (AppRole auth) ---
  # secretManager:
  #   provider: hashicorp_vault
  #   credentialsSecretRef:
  #     name: litellm-vault-credentials
  #   hostedKeys:
  #     - OPENAI_API_KEY
  #   accessMode: read_only
  #   vault:
  #     address: https://vault.example.com:8200
  #     namespace: admin
  #     authMethod: approle
  #     mountName: secret
  #     pathPrefix: litellm/
  #     refreshInterval: 300
---
# Credentials Secret for AWS Secret Manager (static credentials).
# Omit this when using IRSA or another workload identity mechanism.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-aws-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
  AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
