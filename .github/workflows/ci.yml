name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ec5d18412c0aeab7936cb16880d708ba2a64e1ae # v6.2.0
        with:
          version: v2.11.4

      - name: Unit tests (with envtest)
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn
          retention-days: 14

  drift-checks:
    name: Generated-code and bundle drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Regenerate CRDs, RBAC, deepcopy
        run: make manifests generate

      - name: Sync Helm chart CRDs
        run: make sync-helm-crds

      - name: Check for uncommitted generated changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make manifests generate sync-helm-crds' locally and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Regenerate and validate OLM bundle
        # `make bundle` runs `operator-sdk bundle validate ./bundle` at the end
        # using the default validator suite. We do NOT additionally run the
        # stricter `--select-optional suite=operatorframework` here because it
        # also enforces OperatorHub-submission concerns (icon assets, etc.) that
        # are version-stamping rather than correctness issues. Run the strict
        # suite manually before submitting to OperatorHub.
        run: make bundle VERSION=0.0.0-ci IMG=ghcr.io/palenaai/litellm-operator:ci

      - name: Bundle CSV exists
        run: test -f bundle/manifests/litellm-operator.clusterserviceversion.yaml

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # semgrep 1.99.0 transitively depends on opentelemetry-instrumentation
        # 0.46b0, which imports `pkg_resources`. That module is provided by
        # setuptools, but setuptools >= 81 removed it. Install semgrep first
        # (which may bump setuptools), then downgrade setuptools so the
        # pkg_resources import at runtime keeps working.
        run: |
          pip install --no-cache-dir semgrep==1.99.0
          pip install --no-cache-dir --force-reinstall 'setuptools<81'

      - name: Run Semgrep (SARIF, non-blocking)
        run: |
          set +e
          semgrep scan \
            --config=p/golang \
            --config=p/kubernetes \
            --config=p/dockerfile \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --sarif --output=semgrep.sarif
          echo "semgrep_exit=$?"
          # Ensure the file exists so upload-sarif doesn't fail on missing input.
          test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on Semgrep ERROR findings
        run: |
          semgrep scan \
            --config=p/golang \
            --config=p/kubernetes \
            --config=p/dockerfile \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --error

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Hadolint bundle Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: bundle.Dockerfile
          format: sarif
          output-file: hadolint-bundle.sarif
          no-fail: true

      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  go-licenses:
    name: Go license compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Check for forbidden/restricted licenses
        run: |
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore github.com/PalenaAI/litellm-operator

  workflow-security:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install zizmor
        run: pip install --no-cache-dir zizmor==1.5.2

      - name: Run zizmor (SARIF)
        run: zizmor --format sarif .github/workflows/ > zizmor.sarif || true

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on HIGH severity findings
        run: zizmor --min-severity=high .github/workflows/

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Validate PR commit messages
        uses: webiny/action-conventional-commits@8bc41ff4e7d423d56fa4905f6ff79209a78776c7 # v1.3.0

  license-headers:
    name: License headers (Apache 2.0)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check license headers
        uses: apache/skywalking-eyes@cd7b195c51fd3d6ad52afceb760719ddc6b3ee91 # v0.6.0
        with:
          mode: check

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint deploy/charts/litellm-operator/

      - name: Helm template
        run: helm template litellm-operator deploy/charts/litellm-operator/ > /tmp/helm-rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate rendered chart against K8s schemas
        run: |
          kubeconform -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/helm-rendered.yaml

  codeql:
    name: CodeQL
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0

      - name: Analyze
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          category: "/language:go"

  govulncheck:
    name: govulncheck
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go (latest patch matching go.mod)
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Allow stdlib findings to surface as warnings without failing CI —
        # those are remediated by upgrading the Go toolchain, which Renovate
        # handles via go.mod updates. Hard-fail when any vulnerable package
        # lives in a third-party module (its root segment contains a dot,
        # e.g. github.com/...).
        run: |
          set +e
          govulncheck -show=traces ./... | tee govulncheck.txt
          ec=${PIPESTATUS[0]}
          set -e
          if [ "$ec" -eq 0 ]; then
            exit 0
          fi
          # Extract the first path segment of every "Found in:" package. Stdlib
          # segments have no dot (e.g. "net/http"); third-party segments do
          # (e.g. "github.com/foo/bar").
          roots=$(grep '^[[:space:]]*Found in:' govulncheck.txt \
                    | awk '{print $3}' \
                    | awk -F@ '{print $1}' \
                    | awk -F/ '{print $1}' \
                    | sort -u)
          if printf '%s\n' "$roots" | grep -q '\.'; then
            echo "::error::govulncheck found third-party vulnerabilities"
            exit "$ec"
          fi
          if [ -n "$roots" ]; then
            echo "::warning::govulncheck found Go stdlib vulnerabilities — remediate by upgrading Go toolchain in go.mod"
          fi
          exit 0
