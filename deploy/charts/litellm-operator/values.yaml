image:
  repository: ghcr.io/palenaai/litellm-operator
  tag: ""  # Defaults to "v<chart appVersion>" (e.g. v0.23.0)
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

leaderElection:
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

metrics:
  enabled: false
  service:
    port: 8443

installCRDs: true

# Restrict the operator to watch specific namespaces (comma-separated).
# If empty, the operator watches all namespaces.
watchNamespaces: ""
