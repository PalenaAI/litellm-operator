  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: litellm-operator
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: litellm-operator
    control-plane: controller-manager
  name: litellm-operator-controller-manager
  namespace: litellm-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-operator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: litellm-operator
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        image: ghcr.io/palenaai/litellm-operator:v0.11.2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
