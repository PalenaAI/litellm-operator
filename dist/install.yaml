apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: litellm-operator
    control-plane: controller-manager
  name: litellm-operator-controller-manager-metrics-service
  namespace: litellm-operator-system
spec:
